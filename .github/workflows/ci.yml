name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Builds without secrets: server env is validated lazily, at first request.
      - run: npm run build

  # Database-backed suites need a Neon test database. Add repository secrets DATABASE_URL (any database on the
  # endpoint, used to drop/create the test DB), TEST_DATABASE_URL (+ _UNPOOLED) and BETTER_AUTH_SECRET.
  # Ideally point them at a dedicated Neon CI branch.
  database:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
        if: env.TEST_DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.TEST_DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.TEST_DATABASE_URL != ''
      - run: npm run test:integration
        if: env.TEST_DATABASE_URL != ''
      - run: npx playwright install --with-deps chromium
        if: env.TEST_DATABASE_URL != ''
      - run: npx playwright test
        if: env.TEST_DATABASE_URL != ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - run: echo "::notice::Database suites skipped — configure TEST_DATABASE_URL and related secrets to enable."
        if: env.TEST_DATABASE_URL == ''
